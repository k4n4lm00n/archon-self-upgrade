name: archon-self-upgrade
description: |
  Use when: you want to hot-upgrade a live, long-running server to newer code from your
  fork WITHOUT dropping its active communication link (e.g. a messenger-integrated bot),
  with staged build, isolated smoke test, and automatic rollback.
  Triggers: "self upgrade", "hot upgrade", "upgrade the live server", "swap to latest",
            "cutover to new build".
  Does: preflight (ensure `upstream` + `myfork` remotes; fork upstream if `myfork` is
        missing) -> snapshot the live instance as a rollback anchor -> stage the target
        ref in an isolated worktree -> validate (install/type-check/build/tests) ->
        isolated smoke boot with all external creds stripped -> detached, self-healing
        cutover, health-gated on platform parity + operator constraints, that keeps every
        active integration or rolls back.
  NOT for: normal deploys of stateless apps (use your CI/CD), first-time installs, or
           anything without a running process to replace.

  PREREQUISITES (git remotes):
    - `upstream` : the canonical repo you track (default https://github.com/coleam00/Archon).
                   Hard prerequisite — added automatically from UPSTREAM_URL if missing.
    - `myfork`   : YOUR fork (e.g. github.com/<you>/Archon). Created automatically via
                   `gh repo fork` if the remote is missing (needs a connected GitHub identity).
  Terminology: `mylive` = the branch/worktree currently serving (ephemeral, changes every
  upgrade; discovered at snapshot). `mylocal` = your in-flight feature branches — NOT the
  target; push the one you want live to `myfork` and pass it as TARGET_REF.

  Platform-agnostic: this is a plain Archon workflow, not bound to any chat platform, and can
  be triggered from anywhere (chat, the Archon UI, or the API). It names no messenger. The
  default rollback rule is "don't regress": the new build must reach READY_MARKER and its
  health endpoint must report the SAME set of active platforms the old server had (platform
  parity) — so breaking any integration (a messenger adapter, a forge, anything) rolls back.
  Operators add their own rollback constraints via env knobs (REQUIRE_LOG / FORBID_LOG,
  CUTOVER_DEADLINE, HEALTH_CMD / HEALTH_HOOK, and a human CONFIRM_CMD with a timeout). See
  docs/06 and scripts/lib.sh for the full list.

  This workflow reads no secrets from the YAML. All host specifics are env vars with
  defaults (see scripts/lib.sh). Because the final cutover replaces the very process this
  workflow runs inside, that step is launched DETACHED: the workflow returns once the cutover
  is running, and the new (or rolled-back) server reports the final outcome via NOTIFY_CMD
  (point it at the originating messenger to be told the result there) and
  $ARTIFACTS_DIR/cutover-status.json.

  SINGLE SOURCE OF TRUTH: every phase below is a THIN wrapper that `exec`s the matching
  phase script in the scripts/ toolkit (00-preflight … 05-cutover + lib.sh). All logic —
  target resolution, isolation, the health gate, rollback, known-good promotion — lives in
  those scripts; this YAML only orchestrates them and exposes them as an Archon workflow
  (chat trigger, per-step status, artifacts, resumability). The nodes find the toolkit via
  SELFUPGRADE_SCRIPTS (default: $HOME/.archon/.local/upgrade) and point ARCHON_UPGRADE_DIR
  at $ARTIFACTS_DIR so state.json / resolved.env / logs land in the run's artifacts.
  SELF-BOOTSTRAPPING: if the toolkit is not already installed at SELFUPGRADE_SCRIPTS, the
  preflight node fetches scripts/ from the published repo (SELFUPGRADE_REPO, default
  github.com/k4n4lm00n/archon-self-upgrade; SELFUPGRADE_REF, default main) on first run — so
  this single YAML is self-sufficient from the marketplace, with no separate install step.

provider: claude
tags:
  - automation
  - development
# Only `github` is a schema-level requirement; it hard-blocks the run before any cost if
# the user's GitHub identity is not connected — needed to fork `myfork`.
requires:
  - github
# Each run replaces the live process; never run two concurrently on one host.
mutates_checkout: true

nodes:
  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 0 — PREFLIGHT: ensure upstream/myfork remotes (fork upstream if myfork
  # missing), resolve the deploy target from the prompt, persist the resolved
  # config to $ARTIFACTS_DIR/resolved.env for every later phase. -> 00-preflight.sh
  # ═══════════════════════════════════════════════════════════════════════════
  - id: preflight
    description: Ensure upstream/myfork remotes (fork upstream if myfork missing); resolve target; persist config.
    timeout: 180000
    bash: |
      set -uo pipefail
      SU="${SELFUPGRADE_SCRIPTS:-$HOME/.archon/.local/upgrade}"
      # Self-bootstrap: the scripts/ toolkit is the single source of truth, so a one-file
      # marketplace install won't have it yet. If it's absent, fetch it from the published repo
      # into SU (once; later phases reuse the install). Override repo/ref or pre-install to skip.
      if [ ! -f "$SU/lib.sh" ]; then
        SELFUPGRADE_REPO="${SELFUPGRADE_REPO:-https://github.com/k4n4lm00n/archon-self-upgrade}"
        SELFUPGRADE_REF="${SELFUPGRADE_REF:-main}"
        echo "self-upgrade toolkit not at $SU — bootstrapping from $SELFUPGRADE_REPO@$SELFUPGRADE_REF"
        tmp="$(mktemp -d)"
        if git clone --depth 1 --branch "$SELFUPGRADE_REF" "$SELFUPGRADE_REPO" "$tmp" 2>/dev/null \
           || git clone --depth 1 "$SELFUPGRADE_REPO" "$tmp"; then
          mkdir -p "$SU" && cp "$tmp"/scripts/*.sh "$SU"/ && chmod +x "$SU"/*.sh
          rm -rf "$tmp"; echo "installed toolkit scripts -> $SU"
        else
          rm -rf "$tmp"
          echo "FATAL: could not bootstrap self-upgrade scripts from $SELFUPGRADE_REPO"
          echo "set SELFUPGRADE_SCRIPTS to a local install, or SELFUPGRADE_REPO/SELFUPGRADE_REF to a reachable source."
          exit 1
        fi
      fi
      [ -f "$SU/lib.sh" ] || { echo "FATAL: self-upgrade toolkit still missing at $SU after bootstrap"; exit 1; }
      export ARCHON_UPGRADE_DIR="$ARTIFACTS_DIR"   # state.json / resolved.env / logs land in this run's artifacts
      export ARGUMENTS                             # trigger prompt -> resolve_target_ref ("self upgrade to <target>")
      exec bash "$SU/00-preflight.sh"

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — SNAPSHOT: capture the live instance (pgid + worktree + platforms)
  # as the rollback anchor. -> 01-snapshot.sh
  # ═══════════════════════════════════════════════════════════════════════════
  - id: snapshot
    description: Detect the live server (pgid + worktree) and write the rollback anchor.
    depends_on: [preflight]
    timeout: 60000
    bash: |
      set -uo pipefail
      SU="${SELFUPGRADE_SCRIPTS:-$HOME/.archon/.local/upgrade}"
      [ -d "$SU" ] || { echo "FATAL: self-upgrade scripts dir not found: $SU (set SELFUPGRADE_SCRIPTS)"; exit 1; }
      export ARCHON_UPGRADE_DIR="$ARTIFACTS_DIR"
      exec bash "$SU/01-snapshot.sh"

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — STAGE: build the target in an isolated worktree (optional patch-id
  # carry of our unmerged commits). Non-destructive. -> 02-stage.sh
  # ═══════════════════════════════════════════════════════════════════════════
  - id: stage
    description: Create the staging worktree at TARGET_REF (optionally replay our unmerged commits).
    depends_on: [snapshot]
    timeout: 300000
    bash: |
      set -uo pipefail
      SU="${SELFUPGRADE_SCRIPTS:-$HOME/.archon/.local/upgrade}"
      [ -d "$SU" ] || { echo "FATAL: self-upgrade scripts dir not found: $SU (set SELFUPGRADE_SCRIPTS)"; exit 1; }
      export ARCHON_UPGRADE_DIR="$ARTIFACTS_DIR"
      exec bash "$SU/02-stage.sh"

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 3 — VALIDATE: install / type-check / build / tests. Non-destructive.
  # -> 03-validate.sh
  # ═══════════════════════════════════════════════════════════════════════════
  - id: validate
    description: Install, type-check, build, and (optionally) test the staged build.
    depends_on: [stage]
    timeout: 900000
    bash: |
      set -uo pipefail
      SU="${SELFUPGRADE_SCRIPTS:-$HOME/.archon/.local/upgrade}"
      [ -d "$SU" ] || { echo "FATAL: self-upgrade scripts dir not found: $SU (set SELFUPGRADE_SCRIPTS)"; exit 1; }
      export ARCHON_UPGRADE_DIR="$ARTIFACTS_DIR"
      exec bash "$SU/03-validate.sh"

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 4 — SMOKE: boot the staged build in isolation (all creds stripped),
  # assert health + Web-only isolation, then kill. -> 04-smoke.sh
  # ═══════════════════════════════════════════════════════════════════════════
  - id: smoke
    description: Boot the staged build on SMOKE_PORT with external creds stripped; assert health, then kill.
    depends_on: [validate]
    timeout: 180000
    bash: |
      set -uo pipefail
      SU="${SELFUPGRADE_SCRIPTS:-$HOME/.archon/.local/upgrade}"
      [ -d "$SU" ] || { echo "FATAL: self-upgrade scripts dir not found: $SU (set SELFUPGRADE_SCRIPTS)"; exit 1; }
      export ARCHON_UPGRADE_DIR="$ARTIFACTS_DIR"
      exec bash "$SU/04-smoke.sh"

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 5 — CUTOVER: destructive, self-healing. 05-cutover.sh IS the detached
  # runner (it re-sources lib.sh + state.json and redirects its own output). It
  # replaces the process group this workflow runs inside, so it is LAUNCHED
  # DETACHED and this node returns immediately — never `exec`d. The new (or
  # rolled-back) server reports the outcome via NOTIFY_CMD and cutover-status.json.
  # ═══════════════════════════════════════════════════════════════════════════
  - id: cutover
    description: Launch the detached, self-healing cutover (health gate keeps every active integration or rolls back).
    depends_on: [smoke]
    timeout: 60000
    bash: |
      set -uo pipefail
      SU="${SELFUPGRADE_SCRIPTS:-$HOME/.archon/.local/upgrade}"
      [ -d "$SU" ] || { echo "FATAL: self-upgrade scripts dir not found: $SU (set SELFUPGRADE_SCRIPTS)"; exit 1; }
      export ARCHON_UPGRADE_DIR="$ARTIFACTS_DIR"
      mkdir -p "$ARTIFACTS_DIR/logs"
      echo '{"phase":"launching","detail":"detached cutover starting","utc":"'"$(date -u +%FT%TZ)"'"}' > "$ARTIFACTS_DIR/cutover-status.json"
      setsid bash "$SU/05-cutover.sh" </dev/null >>"$ARTIFACTS_DIR/logs/cutover.log" 2>&1 &
      echo "=== cutover launched DETACHED (pid $!) ==="
      echo "This workflow's server will now be replaced. Follow the outcome:"
      echo "  - $ARTIFACTS_DIR/cutover-status.json   (success | rolled_back | FAILED)"
      echo "  - $ARTIFACTS_DIR/logs/cutover.log"
      echo "  - and NOTIFY_CMD (if set), which reports the final result to the originating channel."
